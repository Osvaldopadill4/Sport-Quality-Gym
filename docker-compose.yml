services:
  database:
    image: mysql:8.0
    container_name: gympos-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: gympos
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./gymposprueba5.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: gympos-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/gympos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: secretpassword
    depends_on:
      - database

volumes:
  mysql_data:
