spring.application.name=gympos

# GENERAL - Dynamic port provided by cloud (PORT) or default 8080 locally
server.port=${PORT:8080}

# DATABASE - Configurable with environment variables, falls back to local MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gympos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/HIBERNATE
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# QR JWT CONFIG
gympos.qr.secret-key=${GYMPOS_QR_SECRET_KEY:GymPosSuperSecretaClaveParaTokensQR2026!!}
gympos.qr.expiration-ms=60000
