spring.application.name=demo

# GENERAL
server.port=8080

# DATABASE
# Railway MySQL variables; SPRING_DATASOURCE_* environment variables can override these properties.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:gympos}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# QR JWT CONFIG
gympos.qr.secret-key=GymPosSuperSecretaClaveParaTokensQR2026!!
gympos.qr.expiration-ms=60000